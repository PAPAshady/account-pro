services:
  app:
    build: .
    container_name: next-server
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mongo
    expose:
      - '3000'

  mongo:
    image: mongo:8
    container_name: mongo-server
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  caddy:
    image: caddy:alpine
    container_name: caddy-server
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  caddy-data:
  caddy-config:
  mongo-data
